<meta charset="utf-8" />

<title>The Fridge Graveyard</title>
<meta name="description" content="A food-waste detective app prototype: track expiry dates, rescue leftovers, find recipes, build shopping lists." />
<meta name="theme-color" content="#d6bdf9" />

<!--
  THE FRIDGE GRAVEYARD — single-file prototype
  - React 18 + Tailwind (Play CDN) + Babel Standalone, all loaded from CDNs. Needs an internet
    connection on first open.
  - State is saved by the Python backend (backend/main.py) in SQLite via GET/PUT /api/state.
  - Initial sample data and estimated prices are simulated.
  - User changes are saved locally through the Python backend in SQLite.
  Assumption: Babel compiles the JSX in the browser. That is fine for a prototype; a production
  build would precompile with Vite or similar.
-->

/* =========================================================================

}

button,

textarea {

}

button:active:not(:disabled) {

}

}

.evidence-tag {

}

.evidence-tag::before {

/* =========================================================================
   SHOPPING LIST
   ========================================================================= */

}

}

input[type="checkbox"] {
  accent-color: #A67BB5;
}

   RECIPE CARDS
   ========================================================================= */

.recipe-card {
  background: var(--fg-surface) !important;
  border: 1.5px solid var(--fg-border) !important;

  box-shadow: var(--fg-shadow);
  overflow: hidden;
  transition:

    box-shadow 250ms ease,
    border-color 250ms ease;
}

.recipe-card:hover {
  transform: translateY(-4px);

}

}

.recipe-card .bg-slate-950\/50 {

  color: #49364D !important;

  border-color: #D8B968 !important;
  border-radius: 15px !important;
  animation: rescue-pulse 3s ease-in-out infinite;
  box-shadow: 0 0 0 rgba(240,213,140,0);
}

@keyframes rescue-pulse {
  0%, 100% {
    box-shadow: 0 0 0 rgba(240,213,140,0);
    transform: scale(1);
  }
  50% {
    box-shadow: 0 0 13px rgba(240,213,140,.3);
    transform: scale(1.035);
  }
}

/* =========================================================================
   MASCOTS
   ========================================================================= */

.food-mascot {
  position: relative;
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  overflow: visible;
  animation: mascot-float 3s ease-in-out infinite;
}

.food-mascot svg {
  overflow: visible;
  display: block;
}

.food-mascot.mood-happy {
  animation: mascot-happy 650ms ease-in-out;
}

.food-mascot.mood-worried .mascot-tear {
  animation: mascot-cry 1.8s ease-in-out infinite;
  transform-origin: center;
}

.food-mascot-message {
  position: absolute;
  left: calc(100% - 4px);
  top: 0;
  width: max-content;
  max-width: 125px;
  padding: 7px 10px;
  border-radius: 13px 13px 13px 3px;
  background: #E9B8C5;
  color: #49364D;
  font-family: 'Fredoka', sans-serif;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(35,20,40,.2);
  animation: mascot-message 400ms ease-out both;
  z-index: 2;
}

@keyframes mascot-float {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-5px) rotate(2deg); }
}

@keyframes mascot-cry {
  0%, 100% { transform: translateY(0); opacity: .75; }
  50% { transform: translateY(5px); opacity: 1; }
}

@keyframes mascot-happy {
  0% { transform: scale(1); }
  35% { transform: scale(1.18) rotate(-8deg); }
  70% { transform: scale(1.1) rotate(8deg); }
  100% { transform: scale(1); }
}

@keyframes mascot-message {
  from { opacity: 0; transform: translateY(5px) scale(.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

   STATS AND PROGRESS

  border: 2px solid #DCC9DA;
}

body [class*="bg-emerald-400"] {
  background-color: #8DAE91 !important;

   PREMIUM

body [class*="text-yellow-200"],

/* =========================================================================
   HAPPY RESCUE CELEBRATION
   ========================================================================= */

.rescue-celebration {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  overflow: hidden;
  pointer-events: none;
  background: rgba(35,24,39,.68);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: celebration-backdrop 300ms ease-out both;
}

.rescue-celebration-card {
  position: relative;
  z-index: 2;
  width: min(100%, 370px);
  padding: 30px 24px 26px;
  overflow: visible;
  text-align: center;
  border: 2px solid #E9B8C5;
  border-radius: 28px;
  background:
    radial-gradient(circle at 90% 5%, rgba(217,199,232,.35), transparent 35%),
    radial-gradient(circle at 0% 100%, rgba(243,204,181,.3), transparent 40%),
    #F8EDF0;
  color: #49364D;
  box-shadow: 0 24px 70px rgba(20,12,24,.4);
  animation: celebration-card-in 550ms cubic-bezier(.2,1.4,.4,1) both;
}

.rescue-celebration-card .food-mascot {
  margin: 0 auto 12px;
}

.rescue-eyebrow {
  margin-top: 8px;
  color: #80658B;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .2em;
}

.rescue-title {
  margin-top: 7px;
  color: #A45D79;
  font-family: 'Baloo 2', 'Fredoka', sans-serif;
  font-size: clamp(34px, 10vw, 43px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.03em;
  text-shadow: 2px 3px 0 rgba(217,199,232,.5);
}

.rescue-count {
  margin-top: 13px;
  color: #496C54;
  font-family: 'Fredoka', sans-serif;

.rescue-recipe {

.rescue-stamp {
  display: inline-block;
  margin-top: 22px;
  padding: 8px 12px;
  transform: rotate(-2deg);
  border: 1.5px dashed #8DAE91;
  border-radius: 8px;
  color: #496C54;
  background: #E0EBDD;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
}

/* Confetti */
.rescue-confetti {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.rescue-confetti i {
  position: absolute;
  top: -15px;
  left: var(--x);
  width: 9px;
  height: 14px;
  border-radius: 3px;
  background: var(--confetti);
  opacity: 0;
  animation: rescue-confetti-fall var(--duration) var(--delay) ease-in forwards;
}

.rescue-confetti i:nth-child(1)  { --x: 7%;  --confetti: #E9B8C5; --duration: 2.5s; --delay: 0s; }
.rescue-confetti i:nth-child(2)  { --x: 15%; --confetti: #D9C7E8; --duration: 2.8s; --delay: .1s; }
.rescue-confetti i:nth-child(3)  { --x: 23%; --confetti: #F3CCB5; --duration: 2.4s; --delay: .2s; }
.rescue-confetti i:nth-child(4)  { --x: 31%; --confetti: #F0D58C; --duration: 2.9s; --delay: .05s; }
.rescue-confetti i:nth-child(5)  { --x: 39%; --confetti: #8DAE91; --duration: 2.6s; --delay: .3s; }

@keyframes celebration-backdrop {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes celebration-card-in {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.85) rotate(-3deg);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1) rotate(0);
  }
}

@keyframes rescue-confetti-fall {
  0% { opacity: 0; transform: translateY(-5vh) rotate(0deg); }
  10% { opacity: 1; }
  100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
}

/* =========================================================================
   TOASTS AND SMALL DETAILS
   ========================================================================= */

body #root .fixed[aria-live="polite"] > div {
  background: #F8EDF0 !important;
  color: #49364D !important;
  border: 1px solid #DCC9DA !important;
  box-shadow: 0 10px 30px rgba(20,12,24,.25);
}

* {
  scrollbar-color: #8C718E transparent;
  scrollbar-width: thin;
}

*::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}

*::-webkit-scrollbar-thumb {
  background: #8C718E;
  border-radius: 99px;
}

/* =========================================================================
   GENERAL INTERACTIONS
   ========================================================================= */

@media (prefers-reduced-motion: no-preference) {
  .pop {
    animation: fg-pop 220ms cubic-bezier(.2,.8,.2,1);
  }

  @keyframes fg-pop {
    from { opacity: 0; transform: translateY(8px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }

  .recipe-card,
  .recipe-rescue-badge {
    animation: none !important;
    transition: none !important;
  }

  .rescue-confetti i {
    display: none;
  }
}

// --- Dates are stored as local "YYYY-MM-DD" strings so they survive JSON + timezones.
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => toISO(new Date());
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const daysLeft = (item) => Math.round((parseISO(item.expiryDate) - parseISO(todayISO())) / 86400000);
const fmtDate = (iso) => parseISO(iso).toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
const uid = () => Math.random().toString(36).slice(2, 10);
const caseNo = (id) => '#' + String(id).padStart(4, '0');
const euro = (n) => '€' + (Math.round(n * 100) / 100).toFixed(2);

  expired:  { label: 'Deceased', icon: '🪦', bar: 'bg-zinc-600',    text: 'text-zinc-400',    chip: 'bg-zinc-700/40 text-zinc-300 border-zinc-500/50' },

// Thresholds: expired < 0 days, critical 0–1 days, warning 2–3 days, fresh 4+ days.
function getStatus(item) {
  const d = daysLeft(item);
  if (d < 0) return 'expired';
  if (d <= 1) return 'critical';
  if (d <= 3) return 'warning';
  return 'fresh';
}

// Priority order: soonest expiry first; leftovers win ties (they are the most forgotten).
function byPriority(a, b) {
  const d = daysLeft(a) - daysLeft(b);
  if (d !== 0) return d;
  return (b.isLeftover ? 1 : 0) - (a.isLeftover ? 1 : 0);
}

function daysText(item) {
  const d = daysLeft(item);
  if (d < -1) return `Expired ${-d} days ago`;
  if (d === -1) return 'Expired yesterday';
  if (d === 0) return 'Expires today';
  if (d === 1) return 'Expires tomorrow';
  return `${d} days left`;
}

// The detective's recommendation. Keeps to the four verbs from the brief + a calm "Keep watch".
function suggestAction(item) {
  const s = getStatus(item);
  const cat = catMeta(item.category);
  if (s === 'expired') return { key: 'toss', label: 'Toss', icon: '🗑️',
    reason: "Past its date. If it's only a best-before date, look, smell and taste first. If it's a use-by date (meat, fish, leftovers), let it rest in peace." };
  if (s === 'critical') {
    if (item.isLeftover) return { key: 'eat', label: 'Eat first', icon: '🍽️', reason: 'Leftovers on their last day. Make this your next meal.' };
    if (cat.freezable && !item.frozen) return { key: 'freeze', label: 'Freeze', icon: '🧊', reason: "Won't survive past tomorrow. Cook it tonight, or freeze it now to buy weeks." };
    return { key: 'cook', label: 'Cook tonight', icon: '🍳', reason: 'Expires within a day. Build tonight’s dinner around it.' };
  }
  if (s === 'warning') {
    if (item.isLeftover) return { key: 'eat', label: 'Eat first', icon: '🍽️', reason: 'Leftovers come first. Eat it within the next day or two.' };
    return { key: 'cook', label: 'Cook tonight', icon: '🍳', reason: 'A few days left. Plan it into one of your next meals.' };
  }
  return { key: 'watch', label: 'Keep watch', icon: '👁️', reason: 'Fresh for now. No action needed.' };
}

// Weight used to rank recipes: at-risk items and leftovers count most.
function urgencyWeight(item) {
  const s = getStatus(item);
  let w = s === 'critical' ? 5 : s === 'warning' ? 3 : 1;
  if (item.isLeftover) w += 3;
  return w;
}

// Word-prefix match: "rice" matches "Cooked rice" but not "licorice".
const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const matchesIngredient = (item, ing) => ing.keys.some((k) => new RegExp('\\b' + escapeRe(k), 'i').test(item.name));

function analyzeRecipe(recipe, items) {
  // Expired items are never suggested as ingredients.
  const usable = items.filter((i) => getStatus(i) !== 'expired').sort(byPriority);
  const taken = new Set();
  const usesItems = [];
  const missingIngredients = [];
  for (const ing of recipe.ingredients) {
    const hit = usable.find((i) => !taken.has(i.id) && matchesIngredient(i, ing));
    if (hit) { taken.add(hit.id); usesItems.push({ ingredient: ing.name, item: hit }); }
    else missingIngredients.push(ing);
  }
  const score = usesItems.reduce((s, u) => s + urgencyWeight(u.item), 0) - missingIngredients.length * 0.75;
  const rescues = usesItems.filter((u) => u.item.isLeftover || ['critical', 'warning'].includes(getStatus(u.item))).length;
  return { ...recipe, usesItems, missingIngredients, score, rescues };
}

const API = '/api/state';

// Each browser belongs to a household (a 6-character join code). A new browser gets its own
// household automatically, so visitors never share a fridge unless they join the same code.
const HOUSEHOLD_KEY = 'fg-household-code';
const MEMBER_KEY = 'fg-member-name';
const readLocal = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const writeLocal = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) { /* private mode */ } };
const cleanCode = (c) => String(c || '').replace(/[\s-]/g, '').toUpperCase();
let householdCode = cleanCode(readLocal(HOUSEHOLD_KEY));

class ConflictError extends Error {}

async function createHousehold() {
  const res = await fetch('/api/households', { method: 'POST' });
  if (!res.ok) throw new Error(`Could not create a household: HTTP ${res.status}`);
  householdCode = (await res.json()).code;
  writeLocal(HOUSEHOLD_KEY, householdCode);
  return householdCode;
}

async function fetchRemote() {
  const res = await fetch(API, { cache: 'no-store', headers: { 'X-Household': householdCode } });
  if (res.status === 404 || res.status === 400) return null; // unknown code (e.g. server was reset)
  if (!res.ok) throw new Error(`Load failed: HTTP ${res.status}`);
  const payload = await res.json();
  if (!Object.prototype.hasOwnProperty.call(payload, 'state')) throw new Error('Invalid server response');
  return payload;
}

// Load this household's state. New households start with the demo fridge.
async function loadState() {
  if (!householdCode) await createHousehold();
  let payload = await fetchRemote();
  if (!payload) { await createHousehold(); payload = await fetchRemote(); }
  if (!payload) throw new Error('Could not open a household on the server.');
  if (payload.state === null) return { state: makeSeed(), version: payload.version, fresh: true };
  if (payload.state.version !== STATE_VERSION || !Array.isArray(payload.state.items)) throw new Error('Unsupported saved data. Nothing was overwritten.');
  return { state: payload.state, version: payload.version };
}

// Save and return the new version. 409 means another device in the household saved first.
async function saveState(state, baseVersion) {
  const res = await fetch(API, { method: 'PUT', body: JSON.stringify(state), headers: {
    'Content-Type': 'application/json', 'X-Household': householdCode, 'X-Base-Version': String(baseVersion) } });
  if (res.status === 409) throw new ConflictError('Household changed on another device');
  if (!res.ok) throw new Error(`Save failed: HTTP ${res.status}`);
  return (await res.json()).version;
}

async function checkHousehold(code) {
  const res = await fetch('/api/households/' + encodeURIComponent(cleanCode(code)), { cache: 'no-store' });
  if (res.status === 404) throw new Error('No household found with that code. Check it and try again.');
  if (!res.ok) throw new Error('Enter the 6-character code from the other phone.');
  return res.json();
}

async function fetchMemberStats() {
  const res = await fetch('/api/stats/members', { cache: 'no-store', headers: { 'X-Household': householdCode } });
  return res.ok ? res.json() : [];
}

// Accessible modal: Escape closes, focus is trapped and restored.
// Background scrolling stays locked until ALL open modals are closed.
function Modal({ open, onClose, title, kicker, children, footer }) {
  const ref = useRef(null);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  const titleId = useMemo(() => 'm-' + uid(), []);

  useEffect(() => {
    if (!open) return;

    const prev = document.activeElement;
    const focusables = () =>
      Array.from(ref.current?.querySelectorAll(
        'button:not([disabled]), input, select, textarea, [href]'
      ) || []);

    const onKey = (e) => {
      if (e.key === 'Escape') {
        e.stopPropagation();
        closeRef.current();
      }

      if (e.key === 'Tab') {
        const f = focusables();
        if (!f.length) return;
        const first = f[0];
        const last = f[f.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    };

    document.addEventListener('keydown', onKey);

    const t = setTimeout(() => {
      const el =
        ref.current?.querySelector('[data-autofocus]') ||
        focusables()[0];
      el?.focus();
    }, 0);

    // Preserve the original body overflow only for the first open modal.
    const body = document.body;
    const count = Number(body.dataset.modalCount || 0);

    if (count === 0) {
      body.dataset.modalOriginalOverflow = body.style.overflow;
      body.style.overflow = 'hidden';
    }

    body.dataset.modalCount = String(count + 1);

    return () => {
      clearTimeout(t);
      document.removeEventListener('keydown', onKey);

      const remaining = Math.max(
        0,
        Number(body.dataset.modalCount || 1) - 1
      );

      body.dataset.modalCount = String(remaining);

      if (remaining === 0) {
        body.style.overflow =
          body.dataset.modalOriginalOverflow || '';
        delete body.dataset.modalOriginalOverflow;
        delete body.dataset.modalCount;
      }

      prev?.focus?.();
    };
  }, [open]);

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4">
      <div
        className="fg-modal-backdrop absolute inset-0 backdrop-blur-[2px]"
        onClick={onClose}
        aria-hidden="true"
      />
      <div
        ref={ref}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        className="pop relative flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-2xl border border-slate-700 bg-slate-900 shadow-2xl sm:max-w-lg sm:rounded-2xl"
      >
        <div className="caution-tape h-1.5 shrink-0" aria-hidden="true" />
        <div className="flex items-start justify-between gap-3 border-b border-slate-800 px-5 py-4">
          <div className="min-w-0">
            {kicker && (
              <p className="font-mono text-[11px] uppercase tracking-[0.2em] text-yellow-400/80">
                {kicker}
              </p>
            )}
            <h2 id={titleId} className="font-noir text-xl text-slate-50">
              {title}
            </h2>
          </div>
          <button
            type="button"
            onClick={onClose}
            aria-label="Close"
            className="rounded-lg p-2 text-slate-400 hover:bg-slate-800 hover:text-slate-100"
          >
            ✕
          </button>
        </div>
        <div className="overflow-y-auto px-5 py-4">{children}</div>
        {footer && (
          <div className="shrink-0 border-t border-slate-800 bg-slate-900/95 px-5 py-3">
            {footer}
          </div>
        )}
      </div>
    </div>
  );
}

        <div className="fg-hero-character"><div className="fg-character-halo"></div><FoodMascot type={prime && prime.name.toLowerCase().includes('tomato') ? 'tomato' : prime && prime.name.toLowerCase().includes('spinach') ? 'spinach' : 'broccoli'} mood={prime ? 'worried' : 'happy'} size={132}/><span className="fg-hero-bubble">{prime ? 'Help meee! ♡' : 'Yay! ♡'}</span></div>
      </section>
      <div className="fg-stats-grid"><div className="fg-stat fg-stat-purple"><span>🧺</span><strong>{counts.all}</strong><small>In your fridge</small></div><div className="fg-stat fg-stat-pink"><span>⏰</span><strong>{counts.critical + counts.warning}</strong><small>Need rescuing</small></div><div className="fg-stat fg-stat-green"><span>🌱</span><strong>{counts.fresh}</strong><small>Happy & fresh</small></div><div className="fg-stat fg-stat-yellow"><span>🍱</span><strong>{counts.leftover}</strong><small>Leftover buddies</small></div><div className="fg-stat fg-stat-deceased"><span>🪦</span><strong>{counts.expired}</strong><small>Deceased</small></div></div>

function ItemFormModal({ open, initial, onClose, onSave }) {
  const isEdit = !!initial?.id;
  const blank = () => {
    const t = todayISO();
    return { name: '', category: 'Vegetables', quantity: 1, unit: 'pcs', addedDate: t, expiryDate: addDays(t, CATEGORIES.Vegetables.shelf), notes: '', isLeftover: false };
  };
  const [form, setForm] = useState(blank);
  const [expiryTouched, setExpiryTouched] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    if (open) { setForm(initial ? { ...blank(), ...initial } : blank()); setExpiryTouched(isEdit); setError(''); }
  }, [open]);

  // For new items, keep the expiry suggestion in sync with category / leftover / added date
  // until the user sets it manually. Leftovers default to 3 days (common food-safety guidance).
  const update = (patch) => setForm((f) => {
    const next = { ...f, ...patch };
    if (!expiryTouched && ('category' in patch || 'isLeftover' in patch || 'addedDate' in patch)) {
      const shelf = next.isLeftover ? 3 : catMeta(next.category).shelf;
      next.expiryDate = addDays(next.addedDate || todayISO(), shelf);
    }
    return next;
  });

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return setError('Every piece of evidence needs a name.');
    if (!form.expiryDate) return setError('An expiry date is required.');
    onSave({ ...form, name: form.name.trim(), quantity: Number(form.quantity) || 1 });
  };

  const field = 'mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 focus:border-yellow-400 focus:outline-none';
  const label = 'block font-mono text-[11px] uppercase tracking-wider text-slate-400';

  return (
    <Modal open={open} onClose={onClose} kicker={isEdit ? `Case file ${caseNo(initial.id)}` : 'New evidence'} title={isEdit ? 'Edit evidence' : 'Log evidence'}
      footer={<div className="flex justify-end gap-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" type="submit" form="item-form">{isEdit ? 'Save changes' : 'Add to fridge'}</Btn>
      </div>}>
      <form id="item-form" onSubmit={submit} className="space-y-4" noValidate>
        <label className="block"><span className={label}>Name *</span>
          <input data-autofocus className={field} value={form.name} onChange={(e) => update({ name: e.target.value })} placeholder="e.g. Leftover lasagne" required />
        </label>
        <div className="grid grid-cols-2 gap-3">
          <label className="col-span-2 block sm:col-span-1"><span className={label}>Category</span>
            <select className={field} value={form.category} onChange={(e) => update({ category: e.target.value })}>
              {Object.keys(CATEGORIES).map((c) => <option key={c} value={c}>{CATEGORIES[c].emoji} {c}</option>)}
            </select>
          </label>
          <div className="col-span-2 grid grid-cols-2 gap-3 sm:col-span-1">
            <label className="block"><span className={label}>Qty</span>
              <input type="number" min="0" step="any" inputMode="decimal" className={field} value={form.quantity} onChange={(e) => update({ quantity: e.target.value })} />
            </label>
            <label className="block"><span className={label}>Unit</span>
              <input list="units" className={field} value={form.unit} onChange={(e) => update({ unit: e.target.value })} />
              <datalist id="units">{UNITS.map((u) => <option key={u} value={u} />)}</datalist>
            </label>
          </div>
          <label className="block"><span className={label}>Added</span>
            <input type="date" className={`${field} font-mono`} value={form.addedDate} onChange={(e) => update({ addedDate: e.target.value })} />
          </label>
          <label className="block"><span className={label}>Expires *</span>
            <input type="date" className={`${field} font-mono`} value={form.expiryDate} onChange={(e) => { setExpiryTouched(true); setForm((f) => ({ ...f, expiryDate: e.target.value })); }} required />
          </label>
        </div>
        {!expiryTouched && <p className="-mt-2 text-xs text-slate-500">Expiry pre-filled from typical fridge life. Change it to match the label.</p>}
        <label className="flex cursor-pointer items-center gap-3 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5">
          <input type="checkbox" className="h-4 w-4 accent-yellow-400" checked={form.isLeftover} onChange={(e) => update({ isLeftover: e.target.checked })} />
          <span className="text-sm text-slate-200">This is a leftover <span className="text-slate-500">(gets priority)</span></span>
        </label>
        <label className="block"><span className={label}>Notes</span>
          <textarea rows="2" className={field} value={form.notes} onChange={(e) => update({ notes: e.target.value })} placeholder="Where it is, what it was for…" />
        </label>
        {error && <p role="alert" className="rounded-lg bg-red-500/15 px-3 py-2 text-sm text-red-300">{error}</p>}
      </form>
    </Modal>
  );
}

        <Btn variant="danger" onClick={() => onWasted(item)}>🪦 Mark wasted</Btn>

const DEFAULT_GOALS = { diet: 'any', avoid: [], protein: '', fibre: '', showCalories: false, favourites: '', dislikes: '' };
// "mushrooms, feta" -> ['mushroom', 'feta'] (simple plural trim so either form matches)
const wordList = (text) => String(text || '').split(/[,;\n]/).map(w => w.trim().toLowerCase().replace(/(es|s)$/, '')).filter(w => w.length > 1);
const ALLERGENS = ['milk','eggs','fish','shellfish','soy','wheat','peanuts','tree nuts','sesame'];
const ALLERGEN_PATTERNS = {
 milk: /milk|cheese|yogurt|yoghurt|cream|butter|skyr/i, eggs: /\beggs?\b|mayonnaise/i,
 fish: /salmon|tuna|cod|anchov|\bfish\b/i, shellfish: /shrimp|prawn|crab|lobster/i,
 soy: /soy|tofu|tempeh|edamame/i, wheat: /bread|pasta|tortilla|flour|toast|baguette|noodle|couscous/i,
 peanuts: /peanut/i, 'tree nuts': /almond|walnut|cashew|pistachio|hazelnut|pecan/i,
 sesame: /sesame|tahini/i
};
const MEAT_PATTERN = /chicken|beef|pork|bacon|ham|sausage|turkey|lamb|meat|bolognese/i;
const FISH_PATTERN = /salmon|tuna|cod|fish|shrimp|prawn|anchov|crab/i;
const ANIMAL_PATTERN = /milk|cheese|yogurt|yoghurt|cream|butter|egg|honey|gelatin|collagen/i;
function compatibleRecipe(recipe, goals) {
  const names = recipe.ingredients.map(i => i.name).join(' ') + ' ' + recipe.title;
  if ((goals.avoid || []).some(a => ALLERGEN_PATTERNS[a]?.test(names))) return false;
  // Leftovers (e.g. 'Leftover curry') have unknown contents, so they can't be cleared for a diet.
  if (goals.diet !== 'any' && recipe.ingredients.some(i => /leftover|bolognese|ragu/i.test(i.name))) return false;
  // Disliked ingredients are simply never suggested.
  const ingredientNames = recipe.ingredients.map(i => i.name.toLowerCase()).join(' ');
  if (wordList(goals.dislikes).some(w => ingredientNames.includes(w))) return false;
  if (goals.diet === 'vegan' && (MEAT_PATTERN.test(names) || FISH_PATTERN.test(names) || ANIMAL_PATTERN.test(names))) return false;
  if (goals.diet === 'vegetarian' && (MEAT_PATTERN.test(names) || FISH_PATTERN.test(names))) return false;
  if (goals.diet === 'pescatarian' && MEAT_PATTERN.test(names)) return false;
  if (goals.diet === 'halal' && /pork|bacon|ham|wine|beer|alcohol/i.test(names)) return false;
  return true;
}

  [/bread|baguette|toast/,265], [/milk/,60], [/banana/,89],
  [/yogurt|yoghurt|skyr/,85], [/potato/,77], [/carrot/,41],
  [/lentil/,116], [/chickpea/,164], [/bean/,110], [/oat/,389],
  [/salmon/,208], [/tuna/,132], [/shrimp|prawn/,99],
  [/butter/,717], [/cream/,200], [/broccoli/,34], [/zucchini/,17],

  [/curry|bolognese|ragu/,140], [/corn/,86], [/avocado/,160],

];
const APPROX_GRAMS = {pcs:120, slice:35, slices:35, cup:180, portion:300,
  handful:35, bag:150, cloves:4, clove:4, bottle:15, tbsp:15, tsp:5,

// Nutrition is a broad planning estimate based on reference ingredient quantities,

const PROTEIN_PER_100G = [
  [/potato/,2], [/carrot/,0.9], [/chickpea/,8.9], [/bean/,7], [/broccoli/,2.8], [/zucchini/,1.2],
  [/cucumber/,0.7], [/lemon/,1.1], [/apple/,0.3], [/flour/,10], [/corn/,3.3], [/avocado/,2],
  [/tuna/,26], [/shrimp|prawn/,24], [/butter/,0.9], [/cream/,2.1], [/honey/,0.3],
  [/chicken/,31], [/egg/,13], [/cheese|cheddar|mozzarella|parmesan|feta/,23],
  [/pasta|spaghetti|penne/,13], [/rice/,7], [/soy sauce/,8], [/bread|baguette|toast/,9],
  [/milk/,3.3], [/yogurt|yoghurt|skyr/,9], [/mushroom/,3.1], [/spinach/,2.9],
  [/tomato/,0.9], [/bell pepper/,1], [/onion/,1.1], [/garlic/,6.4],
  [/banana/,1.1], [/tortilla|wrap/,8], [/curry|bolognese|ragu/,8],
  [/pea/,5.4], [/salmon/,20], [/tofu/,12], [/lentil/,9], [/oat/,17]
];
const FIBRE_PER_100G = [
  [/tuna|shrimp|prawn|butter|cream/,0], [/honey/,0.2], [/potato/,2.2], [/carrot/,2.8], [/chickpea/,7.6],
  [/bean/,6], [/broccoli/,2.6], [/zucchini/,1], [/cucumber/,0.5], [/lemon/,2.8], [/apple/,2.4],
  [/flour/,2.7], [/corn/,2.4], [/avocado/,6.7],
  [/chicken|egg|cheese|milk|yogurt|yoghurt|skyr|salmon|soy sauce/,0],
  [/pasta|spaghetti|penne/,3], [/rice/,1.3], [/bread|baguette|toast/,2.7],
  [/mushroom/,1], [/spinach/,2.2], [/tomato/,1.2], [/bell pepper/,2.1],
  [/onion/,1.7], [/garlic/,2.1], [/banana/,2.6], [/tortilla|wrap/,3],
  [/curry|bolognese|ragu/,1.5], [/pea/,5.7], [/tofu/,1], [/lentil/,8], [/oat/,10]
];
const RECIPE_SERVINGS = {r1:2,r2:2,r3:3,r4:3,r5:2,r6:2,r7:2,r8:2,r9:2,r10:2,r11:3,
  r13:8,r16:3,r18:3,r24:4,r26:3,r27:3,r28:3,r29:3,r30:4};
function estimateRecipeNutrition(recipe) {
  let calories = 0, protein = 0, fibre = 0;
  for (const ing of recipe.ingredients) {
    const kcal = KCAL_PER_100G.find(([pattern]) => pattern.test(ing.name.toLowerCase()));
    const p = PROTEIN_PER_100G.find(([pattern]) => pattern.test(ing.name.toLowerCase()));
    const f = FIBRE_PER_100G.find(([pattern]) => pattern.test(ing.name.toLowerCase()));
    const gramsPerUnit = APPROX_GRAMS[ing.unit];
    if (!kcal || !p || !f || !gramsPerUnit || !Number.isFinite(Number(ing.qty))) return null;
    const pieceGrams = /egg/i.test(ing.name) ? 50 : /tortilla/i.test(ing.name) ? 50 : /garlic/i.test(ing.name) ? 4 : /onion/i.test(ing.name) ? 110 : /pepper/i.test(ing.name) ? 140 : 120;
    const weight = Number(ing.qty) * (ing.unit === 'pcs' ? pieceGrams : gramsPerUnit) / 100;
    // Cooked rice is lower in energy than dry rice; don't use dry reference for it.
    calories += weight * (ing.name === 'Cooked rice' ? 130 : kcal[1]);
    protein += weight * (ing.name === 'Cooked rice' ? 2.7 : p[1]);
    fibre += weight * (ing.name === 'Cooked rice' ? 0.4 : f[1]);
  }
  const servings = RECIPE_SERVINGS[recipe.id] || 2;
  return { servings, calories: Math.round(calories / servings / 25) * 25,
    protein: Math.round(protein / servings), fibre: Math.round(fibre / servings) };
}
// Secondary ranking after rescues: favourite ingredients, then protein / fibre goals.
function preferenceScore(recipe, goals) {
  const names = recipe.ingredients.map(i => i.name).join(' ').toLowerCase();
  let score = wordList(goals.favourites).filter(w => names.includes(w)).length * 2;
  const n = estimateRecipeNutrition(recipe);
  if (n) {
    if (Number(goals.protein) > 0) score += Math.min(n.protein / Number(goals.protein), 1) * 3;
    if (Number(goals.fibre) > 0) score += Math.min(n.fibre / Math.max(1, Number(goals.fibre) / 3), 1) * 2;
  }
  return score;
}
function quantityLabel(ing) {
  return `${ing.qty} ${ing.unit}`;
}
function FoodGoals({ goals, onChange, items, shopping, onAddShopping }) {
  const [draft, setDraft] = useState(goals);
  const [saved, setSaved] = useState(false);
  const goalsKey = JSON.stringify(goals);
  useEffect(() => { setDraft(goals); }, [goalsKey]);
  const set = (k,v) => { setDraft(old => ({ ...old, [k]: v })); setSaved(false); };
  const dirty = JSON.stringify(draft) !== JSON.stringify(goals);
  const apply = () => { onChange(draft); setSaved(true); };

  // Suggestions come from actual missing ingredients in rescue-first recipes,
  // rather than an unrelated list of 'healthy' foods.
  const candidates = RECIPES.filter(r => compatibleRecipe(r, draft))
    .map(r => analyzeRecipe(r, items))
    .filter(r => r.usesItems.length > 0)
    .sort((a,b) => b.rescues - a.rescues || b.score - a.score)
    .slice(0, 4)
    .flatMap(r => r.missingIngredients.map(ing => ({name:ing.name, recipe:r.title})))
    .filter((g,i,all) => all.findIndex(x => x.name.toLowerCase() === g.name.toLowerCase()) === i)

  return <details className="mb-5 rounded-3xl border-2 border-purple-100 bg-[#fffdf7] p-5 text-[#493b61]">
    <summary className="cursor-pointer font-display text-xl font-bold">🥗 My food goals & preferences</summary>
    <p className="my-3 text-sm">Optional preferences. Food rescue remains the priority. This is a prototype: recipes are not certified allergen-free or halal, and any nutrition figures are rough estimates.</p>
    <label className="block text-sm font-bold">Eating style<select className="mt-1 block w-full p-2" value={draft.diet} onChange={e=>set('diet',e.target.value)}>
      {['any','vegetarian','vegan','pescatarian','halal'].map(d=><option key={d} value={d}>{d==='any'?'No restriction':d[0].toUpperCase()+d.slice(1)}</option>)}
    </select></label>
    <div className="mt-4 grid gap-3 sm:grid-cols-2">
      <label className="text-sm font-bold">Favourite ingredients<input type="text" placeholder="e.g. mushrooms, feta" value={draft.favourites||''} onChange={e=>set('favourites',e.target.value)} className="mt-1 w-full p-2 font-normal"/><span className="mt-1 block text-xs font-normal">Recipes with these move up the list.</span></label>
      <label className="text-sm font-bold">Ingredients I don't like<input type="text" placeholder="e.g. tuna, avocado" value={draft.dislikes||''} onChange={e=>set('dislikes',e.target.value)} className="mt-1 w-full p-2 font-normal"/><span className="mt-1 block text-xs font-normal">Recipes with these are hidden.</span></label>
    </div>
    <p className="mt-4 text-sm font-bold">Ingredients to avoid (preliminary keyword filtering)</p>
    <div className="mt-2 flex flex-wrap gap-2">{ALLERGENS.map(a=><label key={a} className="flex items-center gap-2 rounded-xl bg-purple-50 px-3 py-2 text-xs"><input type="checkbox" checked={(draft.avoid||[]).includes(a)} onChange={e=>set('avoid',e.target.checked?[...(draft.avoid||[]),a]:(draft.avoid||[]).filter(x=>x!==a))}/>{a}</label>)}</div>
    <div className="mt-4 grid grid-cols-2 gap-3"><label className="text-sm">Protein goal (g/meal)<input type="number" min="0" max="250" placeholder="e.g. 30" value={draft.protein||''} onChange={e=>set('protein',e.target.value)} className="mt-1 w-full p-2"/></label><label className="text-sm">Fibre goal (g/day)<input type="number" min="0" max="100" placeholder="e.g. 25" value={draft.fibre||''} onChange={e=>set('fibre',e.target.value)} className="mt-1 w-full p-2"/></label></div>
    <label className="mt-3 flex items-center gap-2 text-sm"><input type="checkbox" checked={!!draft.showCalories} onChange={e=>set('showCalories',e.target.checked)}/> Show estimated calories, protein & fibre per serving</label>
    <div className="mt-4 flex flex-wrap items-center gap-3">
      <button type="button" onClick={apply} disabled={!dirty} className="rounded-xl bg-lime-200 px-5 py-3 font-bold text-purple-950 disabled:opacity-50">Save my preferences</button>
      <span role="status" aria-live="polite" className="text-xs text-purple-700">{dirty ? 'Unsaved changes — save to update recipes' : saved ? '✓ Preferences applied. Recipes updated; server save is automatic.' : 'Preferences currently applied'}</span>
    </div>
    <p className="mt-2 text-xs text-purple-700">Targets help sort recipes after urgent rescues. Nutrition estimates are per suggested serving, use assumed ingredient quantities and exclude added oil. These are not exact food-label values.</p>
    <div className="mt-5 rounded-2xl border border-purple-100 bg-purple-50 p-4">

      )}</div> : <p className="mt-2 text-xs text-purple-800">No new ingredients to add — you have them or they are already on your list.</p>}

/* Recipe mascots follow the actual fridge item being rescued, never the recipe title. */
const RECIPE_MASCOT_RULES = [
  [/bolognese|spaghetti|pasta|lasagn|macaroni|noodle/i, '🍝'],
  [/curry|stew|soup|broth|chili/i, '🍲'],
  [/chicken|poultry|turkey/i, '🍗'],
  [/beef|steak|meat|mince|keema/i, '🥩'],
  [/salmon|tuna|fish|cod/i, '🐟'],
  [/shrimp|prawn|seafood/i, '🍤'],
  [/tomato/i, '🍅'], [/spinach|kale|lettuce|leaf|salad/i, '🥬'],
  [/broccoli/i, '🥦'], [/egg|frittata/i, '🥚'],
  [/cheese|mozzarella|parmesan/i, '🧀'], [/milk|cream|yogurt|quark/i, '🥛'],
  [/potato/i, '🥔'], [/carrot/i, '🥕'], [/onion/i, '🧅'],
  [/garlic/i, '🧄'], [/pepper|paprika/i, '🫑'],
  [/mushroom/i, '🍄'], [/rice/i, '🍚'], [/bread|toast|baguette/i, '🍞'],
  [/banana/i, '🍌'], [/apple/i, '🍎'], [/orange|citrus/i, '🍊'],
  [/lemon/i, '🍋'], [/strawberr/i, '🍓'], [/berry|blueberr/i, '🫐'],
  [/avocado/i, '🥑'], [/corn/i, '🌽'], [/bean|lentil/i, '🫘'],
  [/cucumber|pickle/i, '🥒'], [/cake|pastry|cookie/i, '🍰'],
  [/leftover/i, '🍱']
];
function recipeMascotForItem(item) {
  const name = String(item?.name || 'Food');
  const rule = RECIPE_MASCOT_RULES.find(([pattern]) => pattern.test(name));
  return { name, emoji: rule ? rule[1] : '🍽️' };
}
function recipeRescueItem(recipe) {
  const candidates = recipe.usesItems
    .map(({item}) => item)
    .filter(item => item.isLeftover || ['critical', 'warning'].includes(getStatus(item)));
  // Urgency first, then earliest expiry. Stable tie-breaker prevents jumping mascots.
  return candidates.sort((a,b) => urgencyWeight(b) - urgencyWeight(a) || byPriority(a,b) || String(a.id).localeCompare(String(b.id)))[0] || null;
}
function RecipeRescueMascot({item}) {
  if (!item) return null;
  const {name, emoji} = recipeMascotForItem(item);
  return (
    <div className="fg-recipe-rescue-character" role="img" aria-label={`${name} rescue mascot says please use me`} title={`Rescue ${name} first`}>
      <span className="fg-recipe-mascot-avatar" aria-hidden="true">
        <span className="fg-recipe-mascot-emoji">{emoji}</span>
        <span className="fg-recipe-mascot-face">•ᴗ•</span>
      </span>
      <span className="fg-recipe-rescue-message"><strong>{name}</strong><span>Rescue me! ♡</span></span>
    </div>
  );
}

function Recipes({ items, shopping, focusItem, clearFocus, onCook, onAddMissing, goScene, goals, onGoalsChange, onAddShopping }) {
  const shoppingNames = useMemo(() => new Set(shopping.filter((s) => !s.checked).map((s) => s.name.toLowerCase())), [shopping]);
  const leads = useMemo(() => {
    let list = RECIPES.filter(r => compatibleRecipe(r, goals)).map((r) => analyzeRecipe(r, items)).filter((r) => r.usesItems.length > 0);
    if (focusItem) list = list.filter((r) => r.usesItems.some((u) => u.item.id === focusItem.id) || r.ingredients.some((ing) => matchesIngredient(focusItem, ing)));
    // Urgent food stays first. Nutrition is a secondary, approximate ingredient-based tie-breaker.
    return list.sort((a, b) => b.rescues - a.rescues || preferenceScore(b, goals) - preferenceScore(a, goals) || b.score - a.score || a.missingIngredients.length - b.missingIngredients.length);
  }, [items, focusItem, goals]);

  return (
    <>
      <SectionTitle kicker="Leads" title="Recipe suggestions">
        Prioritizes rescuing food before expiry, then your saved ingredient preferences. Estimated per-serving protein and fibre appear when nutrition estimates are enabled. Expired items are never used.
      </SectionTitle>
      <FoodGoals goals={goals} onChange={onGoalsChange} items={items} shopping={shopping} onAddShopping={onAddShopping}/>
      {focusItem && (
        <div className="mb-4 flex items-center justify-between gap-2 rounded-xl border border-yellow-400/40 bg-yellow-400/10 px-3 py-2 text-sm">
          <span>Following the trail of <strong>{focusItem.name}</strong></span>
          <Btn variant="ghost" onClick={clearFocus} aria-label="Show all recipes">✕ Clear</Btn>
        </div>
      )}
      {leads.length === 0 ? (
        <EmptyState kind="pan" title="No leads yet."
          action={items.length === 0 ? <Btn variant="primary" onClick={goScene}>Go to the fridge</Btn> : focusItem ? <Btn onClick={clearFocus}>Show all recipes</Btn> : null}>
          {focusItem ? `None of our recipes use ${focusItem.name} yet.` : 'Add some evidence to the fridge and the detective will find recipes that use it.'}
        </EmptyState>
      ) : (
        <ul className="space-y-3">
          {leads.map((r, i) => <RecipeCard key={r.id} recipe={r} index={i} shoppingNames={shoppingNames} onCook={onCook} onAddMissing={onAddMissing} showCalories={!!goals.showCalories} />)}
        </ul>
      )}
      <p className="mt-4 text-center font-mono text-[11px] text-slate-500">Local dataset of {RECIPES.length} recipes · salt, pepper and oil assumed in the pantry</p>
    </>
  );
}

function CookModal({ recipe, onClose, onConfirm, onAddMissing }) {
  const [checked, setChecked] = useState({});
  useEffect(() => { if (recipe) setChecked(Object.fromEntries(recipe.usesItems.map((u) => [u.item.id, true]))); }, [recipe]);
  if (!recipe) return null;
  const chosen = recipe.usesItems.filter((u) => checked[u.item.id]).map((u) => u.item);
  return (
    <Modal open onClose={onClose} kicker="Closing the case" title={recipe.title}
      footer={<div className="flex justify-end gap-2">
        <Btn variant="ghost" onClick={onClose}>Not yet</Btn>
        <Btn variant="primary" onClick={() => onConfirm(recipe, chosen)} disabled={chosen.length === 0}>Cooked it · rescue {chosen.length}</Btn>
      </div>}>
      <p className="text-sm text-[#74636A]">Tick only the items you actually used up. They leave the fridge and count as rescued. Check missing ingredients before cooking.</p>
      <ul className="mt-3 space-y-2">
        {recipe.usesItems.map(({ ingredient, item }) => (
          <li key={item.id}>
            <label className="flex cursor-pointer items-center gap-3 rounded-lg border border-[#DCC9B5] bg-[#F7EBDD] px-3 py-2">
              <input type="checkbox" className="h-4 w-4 accent-yellow-400" checked={!!checked[item.id]} onChange={(e) => setChecked((c) => ({ ...c, [item.id]: e.target.checked }))} />
              <span className="flex-1 text-sm text-[#493B50]">{item.name}<span className="block font-mono text-[11px] text-[#93817B]">for: {ingredient}</span></span>
              <StatusBadge item={item} />
            </label>
          </li>
        ))}
      </ul>
      {recipe.missingIngredients.length > 0 && (
        <div className="mt-4 rounded-lg border border-dashed border-[#C5A991] p-3 text-sm text-[#74636A]">

          <Btn variant="ghost" className="ml-1 px-2 py-1 text-[#80612C]" onClick={() => onAddMissing(recipe)}>Add to list</Btn>
        </div>
      )}
    </Modal>
  );
}

  const [name, setName] = useState('');
  const [qty, setQty] = useState('1');
  const [unit, setUnit] = useState('pcs');
  const open = shopping.filter((s) => !s.checked);
  const done = shopping.filter((s) => s.checked);

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    onAdd([{ name: name.trim(), quantity: Number(qty) || 1, unit: unit || 'pcs', source: 'Manual' }]);
    setName(''); setQty('1');
  };

  const copy = async () => {
    const text = open.map((s) => `- ${s.name} (${s.quantity} ${s.unit})`).join('\n');
    try { await navigator.clipboard.writeText(text); toast('List copied to clipboard.'); }

  );

  return (
    <>

// Plan the next 7 dinners around expiry dates. Greedy: each day picks the recipe that rescues
// the most urgent food still in date on that day; food used on one day can't be reused later.
function planWeek(items, goals) {
  let remaining = items.filter((i) => getStatus(i) !== 'expired');
  const used = new Set();
  const days = [];
  for (let d = 0; d < 7; d++) {
    remaining = remaining.filter((i) => daysLeft(i) >= d); // anything past its date by then is gone
    const options = RECIPES.filter((r) => !used.has(r.id) && compatibleRecipe(r, goals))
      .map((r) => analyzeRecipe(r, remaining))
      .filter((r) => r.usesItems.length > 0)
      .map((r) => {
        const urgency = r.usesItems.reduce((sum, u) => {
          const left = daysLeft(u.item) - d;
          return sum + (left <= 1 ? 5 : left <= 3 ? 3 : 1) + (u.item.isLeftover ? 3 : 0);
        }, 0);
        return { ...r, planScore: urgency - r.missingIngredients.length * 0.75 + preferenceScore(r, goals) * 0.5 };
      })
      .sort((a, b) => b.planScore - a.planScore || a.missingIngredients.length - b.missingIngredients.length);
    const pick = options[0] || null;
    if (pick) {
      used.add(pick.id);
      // Long-life staples (sauces, grains, and anything with a week or more left, like eggs,
      // cheese or onions) usually stretch over several meals, so only perishables get used up.
      const ids = new Set(pick.usesItems.filter((u) => daysLeft(u.item) < 7
        && !['Sauces & Condiments', 'Grains & Pasta'].includes(u.item.category)).map((u) => u.item.id));
      remaining = remaining.filter((i) => !ids.has(i.id));
    }
    days.push({ offset: d, date: addDays(todayISO(), d), recipe: pick });
  }
  const planned = new Set(days.flatMap((day) => (day.recipe ? day.recipe.usesItems.map((u) => u.item.id) : [])));
  const atRisk = items.filter((i) => getStatus(i) !== 'expired' && (['critical', 'warning'].includes(getStatus(i)) || i.isLeftover));
  const uncovered = atRisk.filter((i) => !planned.has(i.id));
  return { days, atRisk, uncovered };
}

const dayLabel = (offset, iso) => offset === 0 ? 'Today' : offset === 1 ? 'Tomorrow'
  : parseISO(iso).toLocaleDateString(undefined, { weekday: 'long' });

function MealPlanner({ items, goals, shopping, onCook, onAddShopping, toast }) {
  const goalsKey = JSON.stringify(goals);
  const plan = useMemo(() => planWeek(items, goals), [items, goalsKey]);
  const openNames = new Set(shopping.filter((x) => !x.checked).map((x) => x.name.toLowerCase()));
  const toBuy = [];
  plan.days.forEach((day) => day.recipe && day.recipe.missingIngredients.forEach((ing) => {
    const key = ing.name.toLowerCase();
    if (openNames.has(key) || toBuy.some((t) => t.name.toLowerCase() === key)) return;
    toBuy.push({ name: ing.name, quantity: ing.qty, unit: ing.unit, source: `Meal plan: ${day.recipe.title}` });
  }));
  const saved = plan.atRisk.length - plan.uncovered.length;

  return (
    <section className="fg-planner" aria-labelledby="planner-h">
      <span className="fg-eyebrow">🗓️ WEEKLY RESCUE PLAN</span>
      <h3 id="planner-h">Your next 7 dinners</h3>
      <p className="fg-planner-sub">Built around what expires first, and your food goals. It updates whenever the fridge changes.</p>
      <p className="fg-planner-summary">{plan.atRisk.length
        ? <>This plan rescues <strong>{saved} of {plan.atRisk.length}</strong> at-risk items before they expire.</>
        : <>Nothing is at risk right now, so the plan simply uses what you have.</>}</p>
      <ol className="fg-plan-days">
        {plan.days.map((day) => (
          <li key={day.date} className={`fg-plan-day ${day.offset === 0 ? 'is-today' : ''}`}>
            <div className="fg-plan-date"><strong>{dayLabel(day.offset, day.date)}</strong><span>{parseISO(day.date).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</span></div>
            {day.recipe ? (
              <div className="fg-plan-body">
                <p className="fg-plan-title">{day.recipe.title}</p>
                <p className="fg-plan-meta">{day.recipe.time} min · {day.recipe.difficulty}</p>
                <p className="fg-plan-uses">{day.recipe.usesItems.map((u) => (
                  <span key={u.item.id} className={`fg-plan-chip fg-chip-${getStatus(u.item)}`}>{u.item.name}</span>
                ))}</p>
                <p className="fg-plan-need">{day.recipe.missingIngredients.length ? `Need: ${day.recipe.missingIngredients.map((m) => m.name).join(', ')}` : '✓ Nothing to buy'}</p>
              </div>
            ) : (
              <div className="fg-plan-body"><p className="fg-plan-title">Free night</p><p className="fg-plan-meta">Nothing left to rescue, so cook whatever you fancy.</p></div>
            )}
            {day.recipe && <button type="button" className="fg-plan-cook" onClick={() => onCook(analyzeRecipe(day.recipe, items))}>🍳 Cook</button>}
          </li>
        ))}
      </ol>
      {plan.uncovered.length > 0 && (
        <p className="fg-plan-warning">⚠️ Not in any recipe: <strong>{plan.uncovered.map((i) => i.name).join(', ')}</strong>. Freeze them or eat them on their own.</p>
      )}
      <div className="fg-plan-actions">
        {toBuy.length
          ? <button type="button" onClick={() => { onAddShopping(toBuy); toast(`${plural(toBuy.length, 'ingredient')} for this week added to the list.`); }}>🛒 Add {plural(toBuy.length, 'missing ingredient')} to the list</button>
          : <span>✓ You already have (or listed) everything for this week.</span>}
      </div>
    </section>
  );
}

function HouseholdPanel({ memberName, onSaveName, toast, askConfirm, logLength }) {
  const [name, setName] = useState(memberName);
  const [code, setCode] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [board, setBoard] = useState(null);
  // Who-ate-what scoreboard from the backend (refreshes after cases are closed).
  useEffect(() => {
    const t = setTimeout(() => fetchMemberStats().then(setBoard).catch(() => setBoard([])), 800);
    return () => clearTimeout(t);
  }, [logLength]);

  const copy = async () => {
    try { await navigator.clipboard.writeText(householdCode); toast('Household code copied. Send it to your flatmates.'); }
    catch (e) { toast(`Your household code is ${householdCode}`); }
  };
  const saveName = (e) => { e.preventDefault(); onSaveName(name); toast(name.trim() ? `Nice to meet you, ${name.trim()}.` : 'Name cleared.'); };
  const join = async (e) => {
    e.preventDefault();
    const c = cleanCode(code);
    if (!/^[A-Z0-9]{6}$/.test(c)) return setErr('Codes are 6 letters and numbers, like K7QM2P.');
    if (c === householdCode) return setErr('That is already your household.');
    setBusy(true); setErr('');
    try {
      const info = await checkHousehold(c);
      askConfirm({
        title: `Join household ${info.code}?`,
        body: `You will switch to that shared fridge (${plural(info.items, 'item')}). Your current fridge stays saved under code ${householdCode}, so note it down if you want to come back.`,
        confirmLabel: 'Join household',
        onConfirm: () => { writeLocal(HOUSEHOLD_KEY, info.code); window.location.reload(); },
      });
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  };

  return (
    <section className="fg-household" aria-labelledby="household-h">
      <span className="fg-eyebrow">🏠 HOUSEHOLD SYNCING</span>
      <h3 id="household-h">Share one fridge</h3>

        <form onSubmit={saveName}>

          <button type="submit">Save name</button>

          <label>Join another household<input value={code} maxLength={8} onChange={(e) => { setCode(e.target.value); setErr(''); }} placeholder="Code from a flatmate" autoCapitalize="characters" /></label>
          <button type="submit" disabled={busy}>{busy ? 'Checking…' : 'Join'}</button>
        </form>
      </div>
      {err && <p role="alert" className="fg-household-error">{err}</p>}
      <div className="fg-scoreboard">
        <p className="fg-scoreboard-title">🕵️ Who ate what</p>

   APP SHELL

const TABS = [
  { id: 'scene', label: 'Fridge', icon: '🔎' },
  { id: 'recipes', label: 'Recipes', icon: '🍳' },
  { id: 'list', label: 'List', icon: '🛒' },
  { id: 'stats', label: 'Stats', icon: '📁' },
  { id: 'extras', label: 'Extras', icon: '⭐' },
];

function App({ initialState, initialVersion, initialFresh }) {
  const [state, setState] = useState(initialState);
  const [memberName, setMemberName] = useState(() => readLocal(MEMBER_KEY));
  const memberRef = useRef(memberName);
  memberRef.current = memberName;
  const [tab, setTab] = useState('scene');
  const [detailId, setDetailId] = useState(null);
  const [form, setForm] = useState({ open: false, initial: null });
  const [cooking, setCooking] = useState(null);
  const [rescueCelebration, setRescueCelebration] = useState(null);
  const rescueTimer = useRef(null);
  const [confirm, setConfirm] = useState(null);
  const [focusId, setFocusId] = useState(null);
  const [toastMsg, setToastMsg] = useState('');
  const toastTimer = useRef(null);

  // Persist every change to the backend (debounced so rapid edits send one request).
  // Saves carry the version they are based on; remote changes from household members are
  // pulled in every few seconds while nothing local is waiting to be saved.
  const saveTimer = useRef(null);
  const saveQueue = useRef(Promise.resolve());
  const versionRef = useRef(initialVersion || 0);
  const skipSave = useRef(!initialFresh);   // loaded state is already saved; a new demo fridge is not
  const changeSeq = useRef(0);
  const savedSeq = useRef(0);

  const applyRemote = (payload, message) => {
    if (!payload) return;
    versionRef.current = payload.version;
    if (payload.state && payload.state.version === STATE_VERSION) {
      skipSave.current = true;
      setState(payload.state);
      if (message) toast(message);
    }
  };

  useEffect(() => {
    if (skipSave.current) { skipSave.current = false; return; }
    const seq = ++changeSeq.current;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const snapshot = state;
      saveQueue.current = saveQueue.current.catch(() => {})
        .then(() => saveState(snapshot, versionRef.current))
        .then((v) => { versionRef.current = v; savedSeq.current = Math.max(savedSeq.current, seq); })
        .catch(async (e) => {
          if (e instanceof ConflictError) {
            savedSeq.current = changeSeq.current;
            applyRemote(await fetchRemote().catch(() => null), 'Someone in your household changed the fridge at the same time. Showing the latest version; please redo your last change if it is missing.');
          } else toast('Save failed. Keep this tab open and check the connection.');
        });
    }, 350);
    return () => clearTimeout(saveTimer.current);
  }, [state]);

  // Household syncing: pull changes made on other phones.
  useEffect(() => {
    const pull = async () => {
      if (document.visibilityState !== 'visible' || savedSeq.current < changeSeq.current) return;
      const payload = await fetchRemote().catch(() => null);
      if (payload && payload.version > versionRef.current && savedSeq.current >= changeSeq.current) {
        applyRemote(payload, 'Fridge updated from your household.');
      }
    };
    const timer = setInterval(pull, 8000);
    document.addEventListener('visibilitychange', pull);
    return () => { clearInterval(timer); document.removeEventListener('visibilitychange', pull); };
  }, []);

  const saveMemberName = (name) => { const n = name.trim().slice(0, 40); setMemberName(n); writeLocal(MEMBER_KEY, n); };

  // Clean up the celebration timer when the app unmounts.
  useEffect(() => {
    return () => clearTimeout(rescueTimer.current);
  }, []);

  const toast = (msg) => {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(''), 3200);
  };

  const { items, shopping } = state;
  const goals = { ...DEFAULT_GOALS, ...(state.goals || {}) };
  const detailItem = items.find((i) => i.id === detailId) || null;
  const focusItem = items.find((i) => i.id === focusId) || null;
  const openCount = shopping.filter((s) => !s.checked).length;
  const goTab = (t) => { setTab(t); window.scrollTo({ top: 0 }); };

  /* ----- item actions ----- */
  const saveItem = (data) => {
    setState((s) => {
      if (data.id) return { ...s, items: s.items.map((i) => (i.id === data.id ? { ...i, ...data } : i)) };
      return { ...s, nextId: s.nextId + 1, items: [...s.items, { ...data, id: s.nextId, frozen: false }] };
    });
    toast(data.id ? 'Case file updated.' : `${data.name} logged as evidence.`);
    setForm({ open: false, initial: null });
  };

  // Close a case: the item leaves the fridge and counts as rescued (eaten) or wasted.
  // Assumption: the whole item is consumed; partial portions are out of scope for the prototype.
  const closeCases = (list, outcome) => {
    const ids = new Set(list.map((i) => i.id));
    setState((s) => {
      const entries = list.map((i) => ({ id: uid(), name: i.name, outcome, category: i.category, date: todayISO(), value: catMeta(i.category).price, by: memberRef.current || 'Someone' }));
      const value = entries.reduce((a, e) => a + e.value, 0);
      const stats = { ...s.stats };
      if (outcome === 'eaten') { stats.rescued += list.length; stats.moneySaved += value; }
      else { stats.wasted += list.length; stats.moneyWasted += value; }
      return { ...s, items: s.items.filter((i) => !ids.has(i.id)), stats, log: [...entries, ...s.log].slice(0, 100) };
    });
  };

  const markEaten = (item) => { closeCases([item], 'eaten'); setDetailId(null); toast(`Case closed: ${item.name} rescued. Nice work, detective.`); };
  const markWasted = (item) => { closeCases([item], 'wasted'); setDetailId(null); toast(`${item.name} laid to rest. It happens. On to the next case.`); };

  // Freezing buys ~30 days (simplification; real freezer life varies by food).
  const freezeItem = (item) => {
    setState((s) => ({ ...s, items: s.items.map((i) => i.id === item.id
      ? { ...i, frozen: true, expiryDate: addDays(todayISO(), 30), notes: (i.notes ? i.notes + ' ' : '') + `Frozen on ${fmtDate(todayISO())}.` }
      : i) }));
    toast(`${item.name} is on ice. 30 more days on the clock.`);
  };

  const deleteItem = (item) => setConfirm({
    title: `Delete ${item.name}?`, body: 'This removes the record without counting it as eaten or wasted.', danger: true, confirmLabel: 'Delete',
    onConfirm: () => { setState((s) => ({ ...s, items: s.items.filter((i) => i.id !== item.id) })); setDetailId(null); toast('Record deleted.'); },
  });

  /* ----- shopping actions ----- */
  const addShopping = (entries) => {
    let added = 0;
    setState((s) => {
      const existing = new Set(s.shopping.filter((x) => !x.checked).map((x) => x.name.toLowerCase()));
      const fresh = [];
      entries.forEach((e) => {
        if (existing.has(e.name.toLowerCase())) return; // no duplicates of open entries
        existing.add(e.name.toLowerCase());
        fresh.push({ id: uid(), checked: false, ...e });
      });
      added = fresh.length;
      return { ...s, shopping: [...fresh, ...s.shopping] };
    });
    return added;
  };

  const addItemToList = (item) => {
    addShopping([{ name: item.name, quantity: item.quantity, unit: item.unit, source: `Item: ${item.name} ${caseNo(item.id)}` }]);
    toast(`${item.name} added to the shopping list.`);
  };

  const addMissing = (recipe) => {
    addShopping(recipe.missingIngredients.map((ing) => ({ name: ing.name, quantity: ing.qty, unit: ing.unit, source: `Recipe: ${recipe.title}` })));
    toast(`Missing ingredients for ${recipe.title} added to the list.`);
  };

  const cookConfirm = (recipe, used) => {
  // Close the cases and record the rescued ingredients.
  closeCases(used, 'eaten');
  setCooking(null);

  // Celebrate only when at least one item was successfully rescued.
  if (used.length > 0) {
    clearTimeout(rescueTimer.current);

    setRescueCelebration({
      count: used.length,
      recipe: recipe.title
    });

    // Automatically dismiss the celebration.
    rescueTimer.current = setTimeout(() => {
      setRescueCelebration(null);
    }, 3000);
  }

  toast(`${recipe.title} served. ${plural(used.length, 'item')} rescued.`);
};

  const resetData = (mode) => setConfirm({
    title: mode === 'demo' ? 'Reload demo data?' : 'Start with an empty fridge?',

    body: 'This replaces your household’s fridge, shopping list, goals and stats for everyone in it.', danger: mode === 'empty',

    confirmLabel: mode === 'demo' ? 'Reload demo' : 'Empty it',
    onConfirm: () => { setState(mode === 'demo' ? makeSeed() : makeEmpty()); setFocusId(null); toast(mode === 'demo' ? 'Demo case files restored.' : 'Fridge cleared. Fresh start.'); },
  });

  const onListNames = new Set(shopping.filter((s) => !s.checked).map((s) => s.name.toLowerCase()));

  return (
    <div className="fg-app-shell min-h-screen pb-28">
      {/* Header */}
      <header className="sticky top-0 z-30 border-b border-slate-800 bg-[#FFF7EC]/90 backdrop-blur">
        <div className="caution-tape h-2" aria-hidden="true" />
        <div className="mx-auto flex max-w-5xl items-center gap-3 px-4 py-3">
          <div className="fg-header-icon flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-700 bg-slate-900 text-xl" aria-hidden="true">🥦</div>
          <div className="min-w-0 flex-1">
            <h1 className="truncate font-noir text-xl leading-tight text-slate-50">The Fridge Graveyard</h1>
            <p className="truncate font-mono text-[10px] uppercase tracking-[0.2em] text-slate-500">YOUR COZY FOOD RESCUE CLUB</p>
          </div>
          <span className="shrink-0 rounded border border-yellow-400/50 px-1.5 py-0.5 font-mono text-[9px] uppercase leading-tight text-yellow-300" title="Sample data and prices are simulated">
            Prototype<br />{state.demo ? 'Demo data' : 'Local data'}
          </span>
        </div>
      </header>

      <main className="fg-main mx-auto max-w-5xl px-4 pt-5">
        {tab === 'scene' && <Dashboard items={items} onOpen={setDetailId} onAdd={() => setForm({ open: true, initial: null })} goRecipes={() => { setFocusId(null); goTab('recipes'); }} />}
        {tab === 'recipes' && <Recipes items={items} shopping={shopping} focusItem={focusItem} clearFocus={() => setFocusId(null)} onCook={setCooking} onAddMissing={addMissing} goScene={() => goTab('scene')} goals={goals} onGoalsChange={g=>setState(v=>({...v,goals:g}))} onAddShopping={addShopping} />}
        {tab === 'list' && <ShoppingList shopping={shopping} toast={toast} onAdd={(e) => { addShopping(e); toast(`${e[0].name} added.`); }}
          onToggle={(id) => setState((s) => ({ ...s, shopping: s.shopping.map((x) => x.id === id ? { ...x, checked: !x.checked } : x) }))}
          onRemove={(id) => setState((s) => ({ ...s, shopping: s.shopping.filter((x) => x.id !== id) }))}
          onClearCompleted={() => { setState((s) => ({ ...s, shopping: s.shopping.filter((x) => !x.checked) })); toast('Completed items cleared.'); }}
          onClearAll={() => setConfirm({ title: 'Clear the whole list?', body: 'Every item on the shopping list will be removed.', danger: true, confirmLabel: 'Clear all',
            onConfirm: () => { setState((s) => ({ ...s, shopping: [] })); toast('Shopping list cleared.'); } })} />}
        {tab === 'stats' && <Stats state={state} onReset={resetData} />}
        {tab === 'extras' && <Extras items={items} goals={goals} shopping={shopping} onCook={setCooking} onAddShopping={addShopping} toast={toast}
          goRecipes={() => { setFocusId(null); goTab('recipes'); }} memberName={memberName} onSaveName={saveMemberName} askConfirm={setConfirm} logLength={state.log.length} />}

        <footer className="mt-10 text-center font-mono text-[10px] uppercase tracking-[0.2em] text-slate-600">

          Prototype · simulated estimates · household {householdCode || '…'} · saved in SQLite
        </footer>
      </main>

      {/* Floating add button (fridge tab only) */}
      {tab === 'scene' && items.length > 0 && (
        <button type="button" onClick={() => setForm({ open: true, initial: null })}
          className="fixed bottom-24 right-4 z-30 flex items-center gap-2 rounded-full bg-yellow-400 px-5 py-3 font-semibold text-slate-950 shadow-lg shadow-black/50 hover:bg-yellow-300 sm:right-[max(1rem,calc(50%-32rem+1rem))]">
          <span aria-hidden="true" className="text-lg leading-none">+</span> Add evidence
        </button>
      )}


      {/* Bottom navigation */}
      <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-slate-800 bg-[#FFF7EC]/95 backdrop-blur" aria-label="Main" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
        <ul className="mx-auto grid max-w-3xl grid-cols-5">
          {TABS.map((t) => (
            <li key={t.id}>
              <button type="button" onClick={() => goTab(t.id)} aria-current={tab === t.id ? 'page' : undefined}
                className={`relative flex w-full flex-col items-center gap-0.5 py-2.5 text-[11px] transition ${tab === t.id ? 'text-[#A85D49]' : 'text-slate-400 hover:text-[#59465F]'}`}>
                {tab === t.id && <span className="absolute inset-x-6 top-0 h-0.5 rounded-full bg-yellow-400" aria-hidden="true" />}
                <span className="text-lg leading-none" aria-hidden="true">{t.icon}</span>
                <span className="font-medium">{t.label}</span>
                {t.id === 'list' && openCount > 0 && (
                  <span className="absolute right-[calc(50%-1.4rem)] top-1 min-w-[1.1rem] rounded-full bg-red-500 px-1 font-mono text-[10px] leading-[1.1rem] text-white" aria-label={`${openCount} items to buy`}>{openCount}</span>
                )}
              </button>
            </li>
          ))}
        </ul>
      </nav>

      {/* Modals */}
      <InterrogationModal item={detailItem} onClose={() => setDetailId(null)}
        onEaten={markEaten} onWasted={markWasted} onFreeze={freezeItem} onAddToList={addItemToList}
        onList={detailItem ? onListNames.has(detailItem.name.toLowerCase()) : false}
        onEdit={(item) => { setDetailId(null); setForm({ open: true, initial: item }); }}
        onDelete={deleteItem}
        onFindRecipes={(item) => { setDetailId(null); setFocusId(item.id); goTab('recipes'); }} />
      <ItemFormModal open={form.open} initial={form.initial} onClose={() => setForm({ open: false, initial: null })} onSave={saveItem} />
      <CookModal recipe={cooking} onClose={() => setCooking(null)} onConfirm={cookConfirm} onAddMissing={(r) => addMissing(r)} />
      <ConfirmModal confirm={confirm} onClose={() => setConfirm(null)} />
      
      {/* Happy rescue celebration */}
{rescueCelebration && (
  <div
    className="rescue-celebration"
    role="status"
    aria-live="polite"
  >
    <div className="rescue-confetti" aria-hidden="true">
      {Array.from({ length: 16 }, (_, i) => (
        <i key={i} />
      ))}
    </div>

    <div className="rescue-celebration-card">
      <FoodMascot
        type="tomato"
        mood="happy"
        size={88}
        showMessage
      />

      <p className="rescue-eyebrow">
        THE CASE IS CLOSED
      </p>

      <h2 className="rescue-title">
        CASE SOLVED!
      </h2>

      <p className="rescue-count">
        {rescueCelebration.count}{" "}
        {rescueCelebration.count === 1 ? "food item" : "food items"} rescued!
      </p>

      <p className="rescue-recipe">
        Thanks to your detective work on
        <strong> {rescueCelebration.recipe}</strong>.
      </p>

      <div className="rescue-stamp">
        ✦ FOOD SAVED · WASTE PREVENTED ✦
      </div>
    </div>
  </div>
)}

      {/* Toast */}
      <div aria-live="polite" className="pointer-events-none fixed inset-x-0 bottom-40 z-[60] flex justify-center px-4">
        {toastMsg && <div className="pop pointer-events-auto max-w-md rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-sm text-slate-100 shadow-xl">{toastMsg}</div>}
      </div>
    </div>
  );
}

// Fetch saved state from the backend first, then mount the app.
function Root() {
  const [initial, setInitial] = useState(null);
  const [error, setError] = useState('');
  const [retry, setRetry] = useState(0);
  useEffect(() => {
    let active = true;
    loadState().then(v => { if (active) setInitial(v); }).catch(e => { if (active) setError(e instanceof TypeError ? 'Could not reach the server. Make sure the backend is running, then retry.' : e.message); });
    return () => { active = false; };
  }, [retry]);
  if (error) return <div className="min-h-screen grid place-items-center p-5"><div className="max-w-md rounded-2xl bg-white p-6 text-center text-purple-900"><h2 className="text-xl font-bold">Your fridge data is safe</h2><p className="my-4">{error}</p><button className="rounded-xl bg-lime-200 px-5 py-3" onClick={() => { setError(''); setRetry(n => n + 1); }}>Retry connection</button></div></div>;
  if (!initial) return <div className="min-h-screen grid place-items-center text-slate-400 font-mono">Opening the case files…</div>;
  return <App initialState={initial.state} initialVersion={initial.version} initialFresh={!!initial.fresh} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
